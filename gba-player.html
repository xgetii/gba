<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GBA</title>
<style>
  :root {
    --black: #040505;
    --fog: #8d9c97;
    --ash: #c3cfca;
    --soot: #1a1f1e;
    font-family: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--black); color: var(--ash); }
  body { overflow: hidden; }

  #home { position: fixed; inset: 0; }
  #home img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 62%;
    filter: brightness(.6) contrast(1.1) saturate(.8);
  }
  #home::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(4,5,5,.95) 0%, rgba(4,5,5,.6) 38%, rgba(4,5,5,0) 70%),
      linear-gradient(0deg, rgba(4,5,5,.8) 0%, rgba(4,5,5,0) 45%);
  }
  .panel {
    position: absolute; z-index: 1; left: 0; bottom: 0;
    padding: 1.5rem max(2rem, env(safe-area-inset-left)) max(1.5rem, env(safe-area-inset-bottom));
    max-width: 26rem; display: flex; flex-direction: column; gap: .9rem;
  }
  .panel p { margin: 0; font-style: italic; font-size: 1rem; line-height: 1.4; color: var(--fog); }
  label.btn, button {
    font: inherit; font-size: 1.05rem; cursor: pointer; color: var(--ash);
    background: rgba(4,5,5,.55); border: 1px solid var(--fog);
    padding: .7rem 1.6rem; width: fit-content; border-radius: 0;
  }
  label.btn:active, button:active { background: var(--ash); color: var(--black); }
  :focus-visible { outline: 2px solid var(--ash); outline-offset: 3px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .err { min-height: 1.2em; color: #c98b8b; font-size: .9rem; }

  #stage { display: none; position: fixed; inset: 0; background: var(--black); }
  #stage.on { display: block; }
  #game { position: absolute; inset: 0; }
  #exit {
    position: absolute; z-index: 20; top: max(.5rem, env(safe-area-inset-top)); right: max(.5rem, env(safe-area-inset-right));
    padding: .3rem .8rem; font-size: .8rem; opacity: .35; background: transparent;
  }
  #exit:hover, #exit:focus-visible { opacity: 1; }

  #turn {
    display: none; position: fixed; inset: 0; z-index: 100; background: var(--black);
    align-items: center; justify-content: center; text-align: center; padding: 2rem;
    font-style: italic; font-size: 1.2rem; color: var(--fog);
  }
  @media (orientation: portrait) { #turn { display: flex; } }
</style>
</head>

  <div class="panel">
    <p>Choose a game file from your cartridge dump. It plays in this tab and saves to this device.</p>
    <label class="btn" for="rom" id="open">Open game</label>
    <input id="rom" type="file" accept=".gba,.zip,.7z" aria-label="Open game">
    <div class="err" id="err" role="alert"></div>
  </div>
</main>

<section id="stage">
  <button id="exit" type="button">Exit</button>
  <div id="game"></div>
</section>

<div id="turn">Turn your phone sideways.</div>

<script>
(function () {
  var input = document.getElementById('rom');
  var err = document.getElementById('err');

  document.getElementById('open').addEventListener('click', function () {
    try {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) {
        var p = req.call(el);
        if (p && p.then) p.then(function () {
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){});
        }).catch(function(){});
      }
    } catch (e) {}
  });

  document.getElementById('exit').addEventListener('click', function () { location.reload(); });

  input.addEventListener('change', function () {
    var file = input.files && input.files[0];
    if (!file) return;
    if (!/\.(gba|zip|7z)$/i.test(file.name)) {
      err.textContent = 'Unsupported file. Choose a .gba, .zip or .7z file.';
      return;
    }
    err.textContent = '';
    start(file);
  });

  function start(file) {
    document.getElementById('home').style.display = 'none';
    document.getElementById('stage').classList.add('on');

    var base = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_player = '#game';
    window.EJS_core = 'gba';
    window.EJS_gameUrl = URL.createObjectURL(file);
    window.EJS_gameName = file.name.replace(/\.[^.]+$/, '');
    window.EJS_pathtodata = base;
    window.EJS_startOnLoaded = true;
    window.EJS_color = '#6f7d78';
    window.EJS_backgroundColor = '#040505';

    var s = document.createElement('script');
    s.src = base + 'loader.js';
    s.onerror = function () {
      document.getElementById('stage').classList.remove('on');
      document.getElementById('home').style.display = '';
      err.textContent = 'The emulator failed to load. Check your connection and try again.';
    };
    document.body.appendChild(s);
  }
})();
</script>
